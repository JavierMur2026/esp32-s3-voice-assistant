# voice-assistant-s3-n16r8 — v2.0 — ESP32-S3 N16R8 Voice Assistant & media player
# Hardware: ESP32-S3 N16R8 devkit (16 MB flash / 8 MB octal PSRAM), INMP441 I2S
#   microphone (i2s_mic bus), MAX98357A I2S amplifier (i2s_speaker bus), WS2812
#   status LED on GPIO48. No physical buttons.
# Audio architecture:
#   - mixer with TWO sources: media_source (music/radio through the media_player)
#     and announcement_source (wake chime, assistant answers, timer beep)
#   - on-device micro_wake_word "okay_nabu" (cutoff 0.97) + HA VAD (aggressive)
#   - assistant TTS arrives as a raw PCM stream straight into the speaker
# LED palette: orange pulse = booting / no HA · solid green 40 % = ready
#   blue pulse 80 % = listening (wake word and follow-up) · solid purple 80 % =
#   thinking / answering · solid red = muted. MASTER: turning the "on board
#   light" entity off in HA silences the status LED; turning it back on
#   RECONCILES it with the real state (muted => red).
# TIMER FINISHED: yellow flash at 100 % synced with the 5 beeps (yellow covers
#   the whole ~800 ms beep, black only 250 ms between beeps); at the end the LED
#   is reconciled (muted = red, otherwise green). Channels stay FIXED yellow for
#   the whole ring; the "black" is brightness 0 % (painting RGB 0 0 0 made HA
#   interleave white frames). NEVER use light.turn_off to blank the LED: it would
#   fire on_turn_off and tear down the led_enabled master switch.
# Known pitfalls (learned the hard way — do not repeat):
#   - voice_assistant on_end fires at the START of the answer (the "done" green
#     belongs in on_tts_stream_end, not on_end)
#   - music left PAUSED jams the mixer and the first answer comes out mute
#     (stop the media_player in on_wake_word_detected, before the chime)
#   - the follow-up re-listen only happens if the HA agent sets continue_conversation
#   - a partial light.turn_on inherits channels/effect => always set full RGB +
#     an explicit effect
#   - the speaker output ring = buffer_duration (500 ms truncated the 0.8 s
#     chime -> 900 ms)

esphome:
  includes:
    - aviso.h  # generic activation chime, 0.8 s @ 70 % (see tools/generate_sounds.py)
  name: voice-assistant-s3-n16r8
  friendly_name: Voice Assistant S3 N16R8
  project:
    name: voice-assistant-s3.community
    version: "2.0"
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    - speaker.volume_set:
        id: va_speaker
        volume: 0.9
    - if:
        condition:
          switch.is_on: led_enabled
        then:
          - light.turn_on:
              id: led_ww
              red: 100%
              green: 50%
              blue: 0%
              brightness: 60%
              effect: fast pulse  # orange until HA connects

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_AUDIO_BOARD_CUSTOM: "y"

psram:
  mode: octal  # "quad" for N8R2 modules, "octal" for N16R8
  speed: 80MHz
  #speed: 120MHz

# Logging
logger:
  hardware_uart: UART0

# Home Assistant API + OTA updates.
# The encryption key and the OTA password come from secrets.yaml
# (see secrets.yaml.example). The ESPHome dashboard can also generate the
# api key automatically when it adds the block for you.
api:
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    # HA connected: re-arm microphone and LED
    # (known limitation: does not check the mute switch yet)
    then:
      - delay: 50ms
      - if:
          condition:
            switch.is_on: led_enabled
          then:
            - light.turn_on:
                id: led_ww
                red: 0%
                green: 100%
                blue: 0%
                brightness: 40%
                effect: none
      - micro_wake_word.start:
  on_client_disconnected:
    # HA gone: stop the assistant and show orange (waiting for reconnection)
    then:
      - voice_assistant.stop:
      - if:
          condition:
            switch.is_on: led_enabled
          then:
            - light.turn_on:
                id: led_ww
                red: 100%
                green: 50%
                blue: 0%
                brightness: 60%
                effect: fast pulse

ota:
  - platform: esphome
    password: !secret ota_password

# WiFi credentials come from secrets.yaml. DHCP by default; if you want a
# static address, add a `manual_ip:` block (static_ip/gateway/subnet/dns1).
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback AP if the WiFi connection fails (password also in secrets.yaml)
  ap:
    ssid: "Voice-Assistant-S3-N16R8"
    password: !secret ap_password

captive_portal:

button:
  - platform: restart
    name: "Restart"
    id: but_rest

switch:
  # LED MASTER: driven by the "on board light" entity in HA; every state
  # light.turn_on below is wrapped in this flag.
  - platform: template
    id: led_enabled
    name: "LED enabled"
    internal: True
    optimistic: True
    restore_mode: RESTORE_DEFAULT_ON
    # When the LED is re-enabled, repaint from the REAL state (mute = red,
    # otherwise resting green). Without this, switching the light back on in HA
    # showed the last color from before it was turned off (green even while
    # muted).
    on_turn_on:
      - if:
          condition:
            switch.is_on: mute
          then:
            - light.turn_on:
                id: led_ww
                red: 100%
                green: 0%
                blue: 0%
                brightness: 60%
                effect: none
          else:
            - light.turn_on:
                id: led_ww
                red: 0%
                green: 100%
                blue: 0%
                brightness: 40%
                effect: none
  # MUTE: stops wake word + assistant; solid red while active
  - platform: template
    id: mute
    name: mute
    optimistic: true
    on_turn_on:
      - micro_wake_word.stop:
      - voice_assistant.stop:
      - if:
          condition:
            switch.is_on: led_enabled
          then:
            - light.turn_on:
                id: led_ww
                red: 100%
                green: 0%
                blue: 0%
                brightness: 60%
                effect: none  # solid red, no leftover pulse
    on_turn_off:
      - micro_wake_word.start:
      - if:
          condition:
            switch.is_on: led_enabled
          then:
            - light.turn_on:
                id: led_ww
                red: 0%
                green: 100%
                blue: 0%
                brightness: 40%
                effect: none
  # Controls the timer-finished alert loop (internal, not actionable from HA)
  - platform: template
    id: timer_ringing
    optimistic: true
    internal: True
    name: "Timer Ringing"
    restore_mode: ALWAYS_OFF

light:
  - platform: esp32_rmt_led_strip
    id: led_ww
    rgb_order: GRB
    pin: GPIO48
    num_leds: 1
    chipset: ws2812
    name: "on board light"
    default_transition_length: 0s  # the core default is a 1 s fade; without
    # this the FIRST timer flash fades in from resting green (looks solid
    # green at 100 %). A per-action transition_length does not work either:
    # it shares the exclusive 'transformer' option group with effect: none.
    effects:
      - pulse:
          name: "Fast Pulse"
          transition_length: 0.5s
          update_interval: 0.5s
          min_brightness: 0%
          max_brightness: 100%
    on_turn_on:
      - switch.turn_on: led_enabled
    on_turn_off:
      - switch.turn_off: led_enabled

# I2S clock lines for the two buses (speaker and microphone)
i2s_audio:
  - id: i2s_mic
    i2s_lrclk_pin: GPIO5   # WS on the INMP441
    i2s_bclk_pin: GPIO6    # SCK on the INMP441
  - id: i2s_speaker
    i2s_lrclk_pin: GPIO12  # LRC on the MAX98357A
    i2s_bclk_pin: GPIO13   # BCLK on the MAX98357A

# I2S microphone (INMP441) and its serial data input pin
microphone:
  - platform: i2s_audio
    id: va_mic
    adc_type: external
    i2s_din_pin: GPIO4     # SD pin on the INMP441
    channel: left
    pdm: false
    i2s_audio_id: i2s_mic
    bits_per_sample: 32 bit

# I2S speaker output (MAX98357A) + the mixer that feeds the physical speaker
speaker:
  - platform: i2s_audio
    id: va_speaker
    i2s_audio_id: i2s_speaker
    dac_type: external
    i2s_dout_pin:
      number: GPIO14       # DIN pin on the MAX98357A
    channel: mono
    bits_per_sample: 16bit
    sample_rate: 16000
    buffer_duration: 900ms  # output ring > longest clip (0.8 s chime);
    # 500 ms used to truncate it
    timeout: 2s

  - platform: mixer
    output_speaker: va_speaker
    source_speakers:
      - id: announcement_source
        buffer_duration: 900ms  # source ring > clip too
      - id: media_source

media_player:
  - platform: speaker
    name: "Media Player"
    id: media_out
    announcement_pipeline:
      speaker: announcement_source
      format: MP3
      num_channels: 1
    media_pipeline:
      speaker: media_source
      format: MP3
      num_channels: 1

# On-device wake word (microWakeWord). cutoff 0.97: expect a few false
# positives with loud background noise; tune with real detection data if needed.
micro_wake_word:
  models:
    - model: okay_nabu
      probability_cutoff: 0.97
  #    sliding_window_size: 5  # default is 5
  #  - model: alexa
  #    probability_cutoff: 0.66
  #    sliding_window_size: 5
  #  - model: hey_jarvis
  #    probability_cutoff: 0.66
  #    sliding_window_size: 5

  on_wake_word_detected:
    # if music was left PAUSED, end it now (before chime and streaming):
    # a paused source jams the mixer and the first answer is lost
    - if:
        condition:
          media_player.is_paused:
            id: media_out
        then:
          - media_player.stop:
              id: media_out
    - lambda: id(announcement_source).start();
    - wait_until:
        condition:
          speaker.is_playing:
            id: announcement_source
    - speaker.play:
        id: announcement_source
        data: !lambda return aviso_raw;
    - voice_assistant.start:
        wake_word: !lambda return wake_word;
        silence_detection: true
    - if:
        condition:
          switch.is_on: led_enabled
        then:
          - light.turn_on:
              id: led_ww
              red: 0%
              green: 30%
              blue: 100%
              brightness: 80%
              effect: fast pulse  # blue pulse = listening

voice_assistant:
  id: va
  microphone: va_mic
  # Music ducking while the assistant listens/answers. The generic mixer does
  # not do it by itself: media_source is reduced by 20 dB on listening and
  # restored on on_tts_stream_end / on_error (NOT on_end — that fires at the
  # START of the answer).
  on_listening:
    - mixer_speaker.apply_ducking:
        id: media_source
        decibel_reduction: 20
        duration: 0s
    # blue pulse for as long as a listen channel is open (including the
    # follow-up wait after continue_conversation); on_stt_end/on_end clear it
    - if:
        condition:
          switch.is_on: led_enabled
        then:
          - light.turn_on:
              id: led_ww
              red: 30%
              green: 30%
              blue: 100%
              brightness: 80%
              effect: fast pulse  # same pulse as the first command
  auto_gain: 5dBFS  # 0..31 (31 = maximum noise immunity)
  noise_suppression_level: 2.0
  volume_multiplier: 4.0
  speaker: announcement_source
  # you stop talking -> thinking (purple). Do NOT use on_stt_end for this:
  # it arrives with the transcript already ready (several seconds late on
  # slow queries).
  on_stt_vad_end:
    - if:
        condition:
          switch.is_on: led_enabled
        then:
          - light.turn_on:
              id: led_ww
              red: 60%
              green: 0%
              blue: 100%
              brightness: 80%
              effect: none  # solid thinking purple, no pulse residue

  on_stt_end:
    then:
      - if:
          condition:
            switch.is_on: led_enabled
          then:
            - light.turn_on:
                id: led_ww
                red: 60%
                green: 0%
                blue: 100%
                brightness: 80%
                effect: none

  # answer audio fully delivered -> resting green (on_end fires at the START
  # of the answer, which is why the green is NOT there).
  on_tts_stream_end:
    - mixer_speaker.apply_ducking:
        id: media_source
        decibel_reduction: 0
        duration: 0s
    - if:
        condition:
          switch.is_on: led_enabled
        then:
          - light.turn_on:
              id: led_ww
              red: 0%
              green: 100%
              blue: 0%
              brightness: 40%
              effect: none
  on_error:
    - mixer_speaker.apply_ducking:
        id: media_source
        decibel_reduction: 0
        duration: 0s
    - micro_wake_word.start:
    - if:
        condition:
          switch.is_on: led_enabled
        then:
          - light.turn_on:
              id: led_ww
              red: 0%
              green: 100%
              blue: 0%
              brightness: 40%
              effect: none
  on_end:
    then:
      # on_end fires at the START of the answer; only set green when no TTS
      # is going to play (the "nevermind" case). Normal green arrives in
      # on_tts_stream_end.
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - if:
                condition:
                  switch.is_on: led_enabled
                then:
                  - light.turn_on:
                      id: led_ww
                      red: 0%
                      green: 100%
                      blue: 0%
                      brightness: 40%
                      effect: none

      - wait_until:
          not:
            voice_assistant.is_running:
      - micro_wake_word.start:

  on_timer_finished:
    - micro_wake_word.stop:
    - voice_assistant.stop:
    - switch.turn_on: timer_ringing

    - if:
        condition:
          switch.is_on: timer_ringing
        then:
          - repeat:
              count: 5  # number of timer-finished beeps
              then:
                - lambda: id(announcement_source).start();
                - delay: 50ms
                # YELLOW flash at full physical brightness (channels and
                # brightness maxed — there is no more; the duty cycle covers
                # the whole beep): yellow ~800 ms (wav is 812 ms) + ~250 ms
                # black between beeps. Channels stay FIXED yellow; black =
                # brightness 0 (avoids color_mode changes: RGB 0 0 0 made HA
                # interleave white frames). Never light.turn_off for black:
                # it would tear down the led_enabled master via on_turn_off.
                # No fade on the first flash: default_transition_length: 0s
                # on the light platform, not a per-action transition_length
                # (exclusive with effect: none).
                - if:
                    condition:
                      switch.is_on: led_enabled
                    then:
                      - light.turn_on:
                          id: led_ww
                          red: 100%
                          green: 100%
                          blue: 0%
                          brightness: 100%
                          effect: none
                - lambda: id(announcement_source).play(id(timer_finished_wave_file), sizeof(id(timer_finished_wave_file)));
                - delay: 800ms
                - if:
                    condition:
                      switch.is_on: led_enabled
                    then:
                      - light.turn_on:
                          id: led_ww
                          red: 100%
                          green: 100%
                          blue: 0%
                          brightness: 0%
                          effect: none
                - delay: 250ms

          - switch.turn_off: timer_ringing

    - wait_until:
        not:
          speaker.is_playing:
            id: announcement_source

    - micro_wake_word.start:
    # after the ring, reconcile the LED with the real state (mute = red, else green)
    - if:
        condition:
          switch.is_on: led_enabled
        then:
          - if:
              condition:
                switch.is_on: mute
              then:
                - light.turn_on:
                    id: led_ww
                    red: 100%
                    green: 0%
                    blue: 0%
                    brightness: 60%
                    effect: none
              else:
                - light.turn_on:
                    id: led_ww
                    red: 0%
                    green: 100%
                    blue: 0%
                    brightness: 40%
                    effect: none

# External component used only to embed the timer beep WAV in flash
# (zero RAM cost: it is streamed from flash).
external_components:
  - source: github://jesserockz/esphome-components
    components: [file]
    refresh: 0s

file:
  - id: timer_finished_wave_file
    file: sounds_timer_finished.wav  # relative to this YAML's folder
